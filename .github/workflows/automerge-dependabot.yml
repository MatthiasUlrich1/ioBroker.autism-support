name: Automerge Dependabot PRs

on:
  # Normally pull_request gets a GITHUB_TOKEN with read access only.
  # Dependabot PRs get write access anyway, so pull_request_target is not required.
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: iobroker-bot-orga/action-automerge-dependabot@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config-file-path: .github/auto-merge.yml
          merge-method: merge
          wait-for-checks: true
