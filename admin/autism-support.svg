	<path
		d="M 22 22 L 106 22 L 106 106 L 22 106 Z M 40 40 L 40 88 L 88 88 L 88 40 Z"
		fill="#FF8A00"
		fill-rule="evenodd"
		clip-path="url(#sector45)"
	/>
